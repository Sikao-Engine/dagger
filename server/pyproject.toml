[project]
name = "loom_server"
version = "0.1.0"
description = "Loom HTTP server + scheduler + DB (Litestar + SQLAlchemy + SQLite)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loom_kernel",
    "loom_agent",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "litestar>=2.0",
    "pydantic>=2.0",
    "anyio>=4.4",
]

[project.optional-dependencies]
serve = ["uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_server"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "alembic", "alembic.ini", "README.md"]

# Server is not held to mypy-strict (kernel is). Ruff + import-linter still apply.
[tool.ruff.lint.per-file-ignores]
"src/loom_server/**/*.py" = ["PLR0913", "PLR0915", "RUF012"]
"tests/**" = ["S101", "PLR2004", "PLR0913", "PLC0415"]
