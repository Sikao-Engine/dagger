# Alembic config for loom_server. Run from repo root:
#   uv run alembic -c server/alembic.ini upgrade head
#   uv run alembic -c server/alembic.ini downgrade base
[alembic]
script_location = server/alembic
prepend_sys_path = server/src packages/loom_kernel/src packages/loom_agent/src
version_path_separator = os
sqlalchemy.url = sqlite:///./loom.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
