[project]
name = "noveltool"
version = "0.1.0"
description = "Deterministic CLI for the Loom novel_digest domain (status/next/fill/check)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["loom-domain-novel-digest"]

[project.scripts]
noveltool = "novel_digest.noveltool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Pure packaging shim: no importable code of its own. The console script is
# provided by the `loom-domain-novel-digest` dependency below.
[tool.hatch.build.targets.wheel]
bypass-selection = true

# Resolve the domain package (and its loom_* deps) from this repo checkout so
# `uv tool install -e .` works standalone, outside the uv workspace.
[tool.uv.sources]
loom-domain-novel-digest = { path = "../", editable = true }
loom_kernel = { path = "../../../packages/loom_kernel" }
loom_cli = { path = "../../../packages/loom_cli" }
