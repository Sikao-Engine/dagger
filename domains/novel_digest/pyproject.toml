[project]
name = "loom-domain-novel-digest"
version = "0.1.0"
description = "Novel digest domain for Loom: chapter summary + timeline + consistency"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["loom_kernel", "loom_cli", "jinja2>=3.1"]

[project.entry-points."loom.domains"]
novel_digest = "novel_digest.plugin:plugin"

[project.scripts]
noveltool = "novel_digest.noveltool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_digest"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
