[project]
name = "dagger-domain-tiny"
version = "0.1.0"
description = "Tiny demo domain for Dagger: local file batch summarization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["dagger_kernel"]

[project.entry-points."dagger.domains"]
tiny = "tiny.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiny"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
