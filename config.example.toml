# Dagger server config — copy this file anywhere, edit, then run:
#
#     uv run server/main_server.py -c path/to/your.toml
#
# All relative paths resolve against THIS FILE's directory, so the config is
# portable: it never depends on where you launch the command from.

# Required. The working directory Dagger opens: run state trees live under
# <workspace>/.dagger, the SQLite DB defaults to <workspace>/dagger.db.
# For the novel_digest domain this is the book dir containing chapters/*.txt.
workspace = "../my-book"

# Bind address of the HTTP server (UI + REST + SSE).
# host = "127.0.0.1"
# port = 8000

# Where run state trees live. Default: <workspace>/.dagger
# data_dir = ".dagger"

# SQLAlchemy URL. Default: sqlite at <workspace>/dagger.db
# db_url = "sqlite:///dagger.db"

# Built frontend bundle (`cd web && pnpm build` output). When set, the SPA is
# served at `/` with deep-link fallback; drop the key to run API-only.
# Relative to this file — from a copy kept at the repo root: "web/dist".
web_dist = "web/dist"
