[project]
name = "loom_agent"
version = "0.1.0"
description = "Agent protocol layer for Loom (backend-agnostic)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loom_kernel",
    "httpx>=0.27",
    "anyio>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_agent"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
