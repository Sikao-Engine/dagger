[project]
name = "loom_cli"
version = "0.1.0"
description = "Deterministic CLI scaffold for Loom (Agent-facing state write path)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loom_kernel",
    "click>=8.1",
]

[project.scripts]
loom = "loom_cli.main:cli"
"loom-state" = "loom_cli.state_cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_cli"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
