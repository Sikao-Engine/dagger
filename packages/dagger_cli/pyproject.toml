[project]
name = "dagger_cli"
version = "0.1.0"
description = "Deterministic CLI scaffold for Dagger (Agent-facing state write path)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dagger_kernel",
    "click>=8.1",
]

[project.scripts]
dagger = "dagger_cli.main:cli"
"dagger-state" = "dagger_cli.state_cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dagger_cli"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
