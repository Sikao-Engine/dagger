[project]
name = "loom_kernel"
version = "0.1.0"
description = "Loom domain-agnostic core: DAG, state, contract, planning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "anyio>=4.4",
    "jsonschema>=4.23",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
yaml = ["ruyaml>=0.91"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loom_kernel"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
